name: build & deploy site
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.changes.outputs.worker }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: detect worker changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null || ! git diff --quiet "$BEFORE" HEAD -- worker/; then
            echo "worker=true" >> "$GITHUB_OUTPUT"
          else
            echo "worker=false" >> "$GITHUB_OUTPUT"
          fi
      - name: setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm build
      - name: check links
        run: pnpm check:links
      - name: check worker bundle
        if: steps.changes.outputs.worker == 'true'
        working-directory: worker
        run: npx --yes wrangler@4.154.0 deploy --dry-run
      - name: upload site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          include-hidden-files: true
      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          retention-days: 7

  preview:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://salm-dev-preview.nicosalm.workers.dev
    concurrency:
      group: preview
      cancel-in-progress: true
    steps:
      - name: download site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - name: keep preview out of search
        run: |
          printf '/*\n  X-Robots-Tag: noindex\n' > dist/_headers
      - name: deploy preview
        run: npx --yes wrangler@4.154.0 deploy --name salm-dev-preview --assets dist --compatibility-date 2026-10-01
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  production:
    needs: preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://salm.dev
    concurrency:
      group: production
    permissions:
      pages: write
      id-token: write
    steps:
      - name: deploy
        uses: actions/deploy-pages@v5

  worker:
    needs: [ build, production ]
    if: needs.build.outputs.worker == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://status.salm.dev
    concurrency:
      group: worker
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: deploy worker
        working-directory: worker
        run: npx --yes wrangler@4.154.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
