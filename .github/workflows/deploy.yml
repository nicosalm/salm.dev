name: build & deploy site
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup pnpm
        uses: pnpm/action-setup@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm build
      - name: check links
        run: pnpm check:links
      - name: upload site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          include-hidden-files: true

  preview:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://salm-dev-preview.nicosalm.workers.dev
    concurrency:
      group: preview
      cancel-in-progress: true
    steps:
      - name: download site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: keep preview out of search
        run: |
          printf '/*\n  X-Robots-Tag: noindex\n' > dist/_headers
      - name: deploy preview
        run: npx --yes wrangler@4.154.0 deploy --name salm-dev-preview --assets dist --compatibility-date 2026-10-01
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  production:
    needs: preview
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://salm.dev
    concurrency:
      group: production
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: download site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
